<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Every step of an attack leaves a trace on the defense side">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a24"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="900" height="290" rx="14" fill="url(#bg)"/>
  <rect width="900" height="290" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="289" rx="14" fill="none" stroke="#30363d"/>

  <text x="450" y="52" text-anchor="middle" class="sans" font-size="16" fill="#e6edf3">Every step leaves a trace.</text>

  <text x="40" y="129" class="mono" font-size="10.5" fill="#f47067" fill-opacity="0.8">offense</text>
  <text x="40" y="209" class="mono" font-size="10.5" fill="#56d4c1" fill-opacity="0.8">defense</text>

  <line x1="150" y1="125" x2="750" y2="125" stroke="#30363d" stroke-width="2"/>
  <line x1="150" y1="205" x2="750" y2="205" stroke="#30363d" stroke-width="2"/>

  <!-- attack progression -->
  <line x1="150" y1="125" x2="150" y2="125" stroke="#f47067" stroke-width="2" stroke-opacity="0.7">
    <animate attributeName="x2" values="150;750;750" keyTimes="0;0.75;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
  </line>
  <!-- step 1 -->
  <text x="150" y="107" text-anchor="middle" class="sans" font-size="12.5" fill="#c9d1d9">Reconnaissance</text>
  <circle cx="150" cy="125" r="6" fill="#0d1117" stroke="#f47067" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="150" cy="205" r="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="150" y="235" text-anchor="middle" class="mono" font-size="11" fill="#484f58">query spike</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.010;0.040;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
    <line x1="150" y1="135" x2="150" y2="195" stroke="#56d4c1" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <circle cx="150" cy="205" r="10" fill="#56d4c1" fill-opacity="0.15"/>
    <circle cx="150" cy="205" r="6" fill="#56d4c1"/>
    <text x="150" y="235" text-anchor="middle" class="mono" font-size="11" fill="#56d4c1">query spike</text>
  </g>
  <!-- step 2 -->
  <text x="300" y="107" text-anchor="middle" class="sans" font-size="12.5" fill="#c9d1d9">Initial access</text>
  <circle cx="300" cy="125" r="6" fill="#0d1117" stroke="#f47067" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="300" cy="205" r="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="300" y="235" text-anchor="middle" class="mono" font-size="11" fill="#484f58">anomalous login</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.188;0.217;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
    <line x1="300" y1="135" x2="300" y2="195" stroke="#56d4c1" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <circle cx="300" cy="205" r="10" fill="#56d4c1" fill-opacity="0.15"/>
    <circle cx="300" cy="205" r="6" fill="#56d4c1"/>
    <text x="300" y="235" text-anchor="middle" class="mono" font-size="11" fill="#56d4c1">anomalous login</text>
  </g>
  <!-- step 3 -->
  <text x="450" y="107" text-anchor="middle" class="sans" font-size="12.5" fill="#c9d1d9">Execution</text>
  <circle cx="450" cy="125" r="6" fill="#0d1117" stroke="#f47067" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="450" cy="205" r="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="235" text-anchor="middle" class="mono" font-size="11" fill="#484f58">suspicious process</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.405;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
    <line x1="450" y1="135" x2="450" y2="195" stroke="#56d4c1" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <circle cx="450" cy="205" r="10" fill="#56d4c1" fill-opacity="0.15"/>
    <circle cx="450" cy="205" r="6" fill="#56d4c1"/>
    <text x="450" y="235" text-anchor="middle" class="mono" font-size="11" fill="#56d4c1">suspicious process</text>
  </g>
  <!-- step 4 -->
  <text x="600" y="107" text-anchor="middle" class="sans" font-size="12.5" fill="#c9d1d9">Lateral movement</text>
  <circle cx="600" cy="125" r="6" fill="#0d1117" stroke="#f47067" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="600" cy="205" r="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="235" text-anchor="middle" class="mono" font-size="11" fill="#484f58">auth cascade</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.562;0.593;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
    <line x1="600" y1="135" x2="600" y2="195" stroke="#56d4c1" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <circle cx="600" cy="205" r="10" fill="#56d4c1" fill-opacity="0.15"/>
    <circle cx="600" cy="205" r="6" fill="#56d4c1"/>
    <text x="600" y="235" text-anchor="middle" class="mono" font-size="11" fill="#56d4c1">auth cascade</text>
  </g>
  <!-- step 5 -->
  <text x="750" y="107" text-anchor="middle" class="sans" font-size="12.5" fill="#c9d1d9">Exfiltration</text>
  <circle cx="750" cy="125" r="6" fill="#0d1117" stroke="#f47067" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="750" cy="205" r="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="750" y="235" text-anchor="middle" class="mono" font-size="11" fill="#484f58">unusual egress</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.780;0.9;0.97;1" dur="10s" repeatCount="indefinite"/>
    <line x1="750" y1="135" x2="750" y2="195" stroke="#56d4c1" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <circle cx="750" cy="205" r="10" fill="#56d4c1" fill-opacity="0.15"/>
    <circle cx="750" cy="205" r="6" fill="#56d4c1"/>
    <text x="750" y="235" text-anchor="middle" class="mono" font-size="11" fill="#56d4c1">unusual egress</text>
  </g>

  <!-- pulse -->
  <circle cx="150" cy="125" r="5" fill="#f47067">
    <animate attributeName="cx" values="150;750;750" keyTimes="0;0.75;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.75;0.82;1" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
