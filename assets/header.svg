<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="cliy0-2 — SOC Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56d4c1" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#56d4c1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#56d4c1" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="470" y="30" width="400" height="190" rx="10"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .log  { font-size: 11.5px; fill: #7d8590; }
      .k    { fill: #56d4c1; }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="250" rx="14" fill="url(#bg)"/>
  <rect width="900" height="250" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="249" rx="14" fill="none" stroke="#30363d"/>

  <!-- identity -->
  <text x="44" y="108" class="sans" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">cliy0-2</text>
  <text x="46" y="142" class="sans" font-size="17" fill="#9da7b3">SOC Analyst <tspan fill="#56d4c1">·</tspan> curious about both sides</text>
  <text x="46" y="192" class="mono" font-size="13" fill="#56d4c1">observe → doubt → verify<tspan fill="#e6edf3"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>▍</tspan></text>

  <!-- log panel -->
  <rect x="470" y="30" width="400" height="190" rx="10" fill="#0a0e14" stroke="#21262d"/>
  <circle cx="488" cy="46" r="4" fill="#30363d"/>
  <circle cx="501" cy="46" r="4" fill="#30363d"/>
  <circle cx="514" cy="46" r="4" fill="#30363d"/>
  <text x="852" y="50" class="mono" font-size="10.5" fill="#484f58" text-anchor="end">auth.log · live<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.53;0.94;1" dur="6s" repeatCount="indefinite"/></text>
  <text x="852" y="50" class="mono" font-size="10.5" fill="#e3b341" text-anchor="end" opacity="0">⚑ 1 line doesn't add up<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.53;0.94;1" dur="6s" repeatCount="indefinite"/></text>

  <g clip-path="url(#panelClip)">
    <!-- anomaly highlight -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.53;0.94;1" dur="6s" repeatCount="indefinite"/>
      <rect x="470" y="157" width="400" height="19" fill="#e3b341" fill-opacity="0.10"/>
      <rect x="470" y="157" width="3" height="19" fill="#e3b341"/>
    </g>

    <g class="mono log" xml:space="preserve">
      <text x="486" y="76"><tspan class="k">08:14:02</tspan>  auth   ok   svc-backup  10.0.4.12</text>
      <text x="486" y="95"><tspan class="k">08:14:05</tspan>  dns    q    updates.vendor.net</text>
      <text x="486" y="114"><tspan class="k">08:14:09</tspan>  auth   ok   a.walker    10.0.2.31</text>
      <text x="486" y="133"><tspan class="k">08:14:11</tspan>  proxy  200  GET /api/status</text>
      <text x="486" y="152"><tspan class="k">08:14:17</tspan>  auth   ok   svc-backup  10.0.4.12</text>
      <text x="486" y="171" fill="#c9d1d9"><tspan class="k">08:14:19</tspan>  auth   ok   svc-backup  203.0.113.47</text>
      <text x="486" y="190"><tspan class="k">08:14:23</tspan>  dns    q    cdn.vendor.net</text>
      <text x="486" y="209"><tspan class="k">08:14:30</tspan>  proxy  200  GET /health</text>
    </g>

    <!-- scan line -->
    <rect x="470" y="0" width="400" height="36" fill="url(#scan)">
      <animate attributeName="y" values="24;196;196" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
